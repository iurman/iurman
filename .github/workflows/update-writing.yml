name: update writing section

on:
  schedule:
    # 06:00 UTC daily. Cron on GitHub is best-effort and can run late.
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Optional instant updates. From the portfolio's deploy step:
  #   curl -X POST https://api.github.com/repos/iurman/iurman/dispatches \
  #     -H "Authorization: Bearer $PROFILE_README_TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     -d '{"event_type":"blog-updated"}'
  # Needs a fine-grained PAT with contents:write on iurman/iurman only.
  repository_dispatch:
    types: [blog-updated]

permissions:
  contents: write

concurrency:
  group: update-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite the Writing section from the RSS feed
        run: node scripts/update-writing.mjs README.md

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update writing section from blog feed"
          # Retry once against a concurrent push to the default branch.
          git push || {
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
