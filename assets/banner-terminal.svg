<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="362" viewBox="0 0 1200 362" role="img" aria-label="isaac@nightsky — terminal">
  <title>isaac@nightsky:~$ whoami — Isaac Urman, Product Engineer</title>
  <defs>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#32746D" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#89AAE6" stop-opacity="0.12"/>
    </linearGradient>
    <style>
      .m { font-family: ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; font-size: 19px; }
      .p { fill: #32746D; }
      .c { fill: #89AAE6; }
      .o { fill: #b8bab2; }
      .d { fill: #7b7e75; }
      .e { fill: #FFC4D1; }
    </style>
  </defs>

  <rect width="1200" height="362" fill="#040403"/>

  <!-- window -->
  <rect x="16" y="14" width="1168" height="334" rx="12" fill="#0c0c0a" stroke="#1e1f1b" stroke-width="1"/>

  <!-- title bar -->
  <path d="M16 26a12 12 0 0 1 12-12h1144a12 12 0 0 1 12 12v22H16z" fill="url(#tbar)"/>
  <line x1="16" y1="48" x2="1184" y2="48" stroke="#1e1f1b" stroke-width="1"/>
  <circle cx="44" cy="31" r="5.5" fill="#FFC4D1" opacity="0.85"/>
  <circle cx="66" cy="31" r="5.5" fill="#89AAE6" opacity="0.85"/>
  <circle cx="88" cy="31" r="5.5" fill="#32746D" opacity="0.95"/>
  <text x="600" y="36" text-anchor="middle" class="m d" font-size="14" letter-spacing="1.5">isaac@nightsky: ~</text>

  <!-- session -->
  <g class="m">
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="90"><tspan class="p">isaac@nightsky</tspan><tspan class="d">:</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan><tspan class="o">whoami</tspan></text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.11;0.12;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="122" class="o">Isaac Urman &#8212; product engineer &amp; team lead, Boston</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.21;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="162"><tspan class="p">isaac@nightsky</tspan><tspan class="d">:</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan><tspan class="o">cat /etc/motd</tspan></text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.29;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="194" class="o">I take products from idea to production: the app, the systems</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.34;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="222" class="o">behind it, and the infrastructure it runs on.</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.43;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="262"><tspan class="p">isaac@nightsky</tspan><tspan class="d">:</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan><tspan class="e">systemctl status ship.service</tspan></text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.51;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="294"><tspan class="d">&#9679; ship.service &#8212; </tspan><tspan class="p">active (running)</tspan><tspan class="d">  since 2018;  restarts: plenty</tspan></text>
    </g>

    <!-- trailing prompt + cursor -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.59;1" dur="14s" repeatCount="indefinite"/>
      <text x="44" y="330"><tspan class="p">isaac@nightsky</tspan><tspan class="d">:</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan><tspan class="c" opacity="1">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
